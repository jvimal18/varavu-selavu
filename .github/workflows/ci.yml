name: CI

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - 'phase1/**'

  pull_request:
    branches:
      - main
      - 'phase1/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Primary: GitHub-hosted runner. Free for public repos, no machine overhead.
  # Runs inside node:22-bookworm via the reusable workflow so it doesn't
  # pollute the hosted image. If this fails (GitHub outage, quota, infra
  # issue), the self-hosted job below picks up the slack.
  hosted:
    name: Build & Test (hosted)
    uses: ./.github/workflows/build-and-test.yml
    with:
      runner: ubuntu-latest
    secrets: inherit

  # Fallback: self-hosted runner. Only runs if the hosted job failed or was
  # cancelled (e.g., GitHub Actions outage like the one on 2026-08-07 that
  # motivated this chain). Runs inside node:22-bookworm so the host stays
  # clean. Branch protection should require this check so merges stay gated
  # on real CI success even when hosted is unavailable.
  self-hosted:
    name: Build & Test (self-hosted fallback)
    needs: hosted
    if: failure()
    uses: ./.github/workflows/build-and-test.yml
    with:
      runner: '["self-hosted","linux","dev"]'
    secrets: inherit
