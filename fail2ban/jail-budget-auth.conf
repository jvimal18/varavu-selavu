# NOTE: The app binds 127.0.0.1:3000 behind Tailscale Funnel. Connections
# arrive from tailscaled on localhost, so the iptables ban here can only
# block the loopback connection — the real client IP enforcement is done
# in-app via the 20/min throttle and 5-fail/15-min block in
# server/utils/rateLimit.ts. This jail provides the standard Fail2Ban
# logging/structure for repeated failures from a single source.

[budget-tracker-auth]
enabled  = true
backend  = systemd
journalmatch = _SYSTEMD_UNIT=budget-tracker.service
maxretry = 5
findtime = 900
bantime  = 3600
filter   = budget-auth
